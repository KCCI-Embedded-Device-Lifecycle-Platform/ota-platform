spring.application.name=ota-server
server.port=8081

spring.datasource.url=${OTA_DB_URL:jdbc:postgresql://localhost:5432/ota}
spring.datasource.username=${OTA_DB_USERNAME:ota}
spring.datasource.password=${OTA_DB_PASSWORD:ota_dev_password}

spring.flyway.enabled=true

spring.rabbitmq.host=${OTA_DMF_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${OTA_DMF_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${OTA_DMF_RABBITMQ_USERNAME:hawkbit}
spring.rabbitmq.password=${OTA_DMF_RABBITMQ_PASSWORD:hawkbit}

ota.hawkbit.dmf.enabled=${OTA_HAWKBIT_DMF_ENABLED:false}
ota.hawkbit.dmf.tenant=${OTA_HAWKBIT_TENANT:DEFAULT}
ota.hawkbit.dmf.hawkbit-exchange=dmf.exchange
ota.hawkbit.dmf.reply-exchange=ota.lwm2m.connector.exchange
ota.hawkbit.dmf.reply-queue=ota.lwm2m.connector.queue

ota.hawkbit.artifact-cache-directory=${OTA_HAWKBIT_ARTIFACT_CACHE_DIRECTORY:/tmp/ota-hawkbit-artifacts}
ota.hawkbit.artifact-max-size-bytes=${OTA_HAWKBIT_ARTIFACT_MAX_SIZE_BYTES:16777216}

ota.hawkbit.coap-proxy.port=${OTA_HAWKBIT_COAP_PROXY_PORT:5685}
ota.hawkbit.coap-proxy.public-host=${OTA_HAWKBIT_COAP_PROXY_PUBLIC_HOST:127.0.0.1}
ota.hawkbit.coap-proxy.block-size=${OTA_HAWKBIT_COAP_PROXY_BLOCK_SIZE:1024}